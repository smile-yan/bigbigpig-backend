# Supply-chain policy for `cargo deny check` (Phase 7).
#
# - Advisories: ignored entries are either unreachable (HS256-only JWT and
#   RSA public-key password exchange; see .cargo/audit.toml) or unmaintained
#   notices with no known vulnerability and no fixed release. `cargo deny`
#   resolves only the features this workspace enables, so it never sees
#   lockfile-only crates such as the unused sqlx `sqlite` driver.
# - Licenses: permissive licenses only; GPL/AGPL/SSPL and unknown licenses
#   fail the check.
# - Sources: crates.io only; no git or unknown registries.
# - Bans: wildcard versions are forbidden. Duplicate major versions are
#   reported but not fatal, because tokio/tower/rustls legitimately pull
#   several generations at once.

[advisories]
version = 2
ignore = [
    # Unreachable: HS256-only JWT and RSA public-key password exchange.
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
    # Dev-only: `testcontainers` uses astral-tokio-tar to extract images.
    # It is not linked into the production binary and has no known
    # vulnerability, only an unmaintained notice.
    "RUSTSEC-2026-0440",
    # Unmaintained only (no known vulnerability) and no fixed release.
    # chrono is a direct dependency for the Go-time contract, also pulled in
    # by sqlx's and tracing-subscriber's `chrono` features; chrono-tz is a
    # direct dependency for timezone parsing. Migration to jiff/time is
    # tracked as a separate follow-up in docs/security-checklist.md.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "MITNFA",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

# This repository is a private deployment artifact, not a published crate.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
