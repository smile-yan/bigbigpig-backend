# Smileyan backend: Go -> Rust canary / cutover locations.
#
# This is a drop-in block to merge into the existing site server{} (it does
# not define listen/server_name/root, so it cannot replace the frontend
# config by itself).
#
# Terminals during the canary:
#   GET/HEAD/OPTIONS  -> split_clients percentage to Rust, remainder to Go
#   everything else   -> Go (writes must stay on one search-index owner)
#   /api/search       -> pinned to Go until the cutover (see below)
#
# Ports: Go 127.0.0.1:8080, Rust staging 127.0.0.1:8081, Rust prod 8080
# after the cutover (stop Go first, or move it to another port).

split_clients "${remote_addr}${http_user_agent}${request_uri}" $canary_addr {
    # Stage 1: 5%. Stage 2: 25%. Stage 3: 50%.
    # Stage 4 (cutover): stop Go, restart Rust with APP_PORT=8080, then delete
    # this block and the map below and proxy directly to 127.0.0.1:8080 (see
    # README.md §2 step 3). Do not point `*` at 8081 while the map's default is
    # 8080: writes would go to the stopped Go process.
    5%  "127.0.0.1:8081";
    *   "127.0.0.1:8080";
}

# Writes stay on Go during the canary. The Rust instance keeps its own
# in-memory tantivy index; a blog post written to Go would not appear in it
# until Rust restarts.
map $request_method $smileyan_backend {
    default "127.0.0.1:8080";
    GET     $canary_addr;
    HEAD    $canary_addr;
    OPTIONS $canary_addr;
}

# Keep search on Go until the cutover: during the canary the two indexes can
# disagree for newly published posts. Delete this block after the cutover.
location = /api/search {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /api/ {
    proxy_pass http://$smileyan_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
}

location /v1/ {
    # TTS is a POST today; the map already sends it to Go during the canary.
    proxy_pass http://$smileyan_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE / binary passthrough must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /uploads/ {
    proxy_pass http://$smileyan_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
