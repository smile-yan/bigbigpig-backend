name: Release

# Triggers on pushes of tags matching vX.Y.Z (e.g. v1.0.0, v2.3.1-rc1).
# - Preflight: validates SERVERS_CONFIG, then verifies over SSH that every
#   listed server is reachable and that its deploy_path exists and is
#   writable. It runs in parallel with the build (saving ~20s) but still gates
#   every deploy job, so an unreachable server no longer delays the artifact.
# - Builds the static x86_64-unknown-linux-musl binary with cross.
# - Publishes a GitHub Release containing a three-file prod tarball:
#   smileyan-backend, deploy-remote.sh and config.yaml (mode: prod).
# - Auto-generates a changelog from grouped PRs / commits since the previous tag.
# - For stable (non-prerelease) tags, deploys to every server in the
#   SERVERS_CONFIG repository variable over SSH, in parallel. The deploy job
#   extracts the release tarball, then sends the binary as a zstd patch built
#   against the deployed one (scripts/transfer-binary.sh), which is ~5% of the
#   file instead of the ~28% an rsync block delta can do on a rebuilt Rust
#   binary. A byte-identical binary (common for CI-only tags) is skipped
#   entirely. The small config.yaml / deploy-remote.sh files are uploaded
#   separately, the SHA256 of the transferred binary is verified on the server,
#   and the existing deploy-remote.sh runs unchanged (PID/port-scoped
#   stop/rollback contract). rsync delta remains the fallback whenever no
#   matching basis release can be found.
#
# No application secret is needed to build: the Rust binary resolves
# DB/Redis/email/TTS configuration at runtime. DEPLOY_SSH_KEY is consumed by
# the config/preflight jobs; the application secrets are only written into the
# server-side .env by the deploy job.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release and upload the asset

# Serialize releases: two tags must not deploy to the same servers at once,
# and an in-flight release may be mid-restart, so never cancel it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate deployment config
    runs-on: ubuntu-latest

    steps:
      - name: Check SERVERS_CONFIG and deploy key
        # Surface the raw value as the runner sees it before validating it.
        # This runs without a matrix so a malformed SERVERS_CONFIG fails with
        # a readable message instead of an opaque fromJSON error on the
        # preflight matrix.
        env:
          RAW: ${{ vars.SERVERS_CONFIG }}
          S_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          echo "=== vars.SERVERS_CONFIG (raw, repr) ==="
          printf '%s\n' "${RAW:-<unset>}" | python3 -c "import sys; data=sys.stdin.read(); print(repr(data))"
          echo
          echo "=== length / line count ==="
          if [ -z "${RAW:-}" ]; then
            echo "<empty / unset>"
          else
            printf 'bytes=%d  lines=%d\n' "${#RAW}" "$(printf '%s' "$RAW" | wc -l | tr -d ' ')"
          fi
          echo
          echo "=== validation ==="

          python3 - <<'PY'
          import json, os, sys

          raw = os.environ.get("RAW", "").strip()
          if not raw:
              print("ERROR: repository variable SERVERS_CONFIG is empty", file=sys.stderr)
              sys.exit(1)

          try:
              servers = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"ERROR: SERVERS_CONFIG is not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(servers, list) or not servers:
              print("ERROR: SERVERS_CONFIG must be a non-empty JSON array", file=sys.stderr)
              sys.exit(1)

          required = ("name", "addr", "port", "user", "deploy_path")
          failed = False
          for index, server in enumerate(servers):
              if not isinstance(server, dict):
                  print(f"ERROR: SERVERS_CONFIG[{index}] is not an object", file=sys.stderr)
                  failed = True
                  continue
              missing = [key for key in required if not str(server.get(key, "")).strip()]
              if missing:
                  print(
                      f"ERROR: SERVERS_CONFIG[{index}] "
                      f"({server.get('name', '<unnamed>')}) is missing: {', '.join(missing)}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)

          print(f"OK: {len(servers)} server(s) configured")
          PY

          if [ -z "$S_SSH_KEY" ]; then
            echo "ERROR: DEPLOY_SSH_KEY is empty; preflight cannot verify SSH" >&2
            exit 1
          fi
          echo "DEPLOY_SSH_KEY is present."

  preflight:
    name: Preflight ${{ matrix.server.name }}
    # Gate the build on SSH access and an existing deploy directory. Runs for
    # every release tag so a bad server entry fails in seconds, not after the
    # musl build.
    needs: validate-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as the deploy job, so we verify exactly the servers the
        # deploy will touch.
        server: ${{ fromJSON(vars.SERVERS_CONFIG || '[]') }}

    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_ADDR" >> ~/.ssh/known_hosts

      - name: Check SSH connectivity
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
          SSH_USER: ${{ matrix.server.user }}
        run: |
          set -euo pipefail
          echo ">>> [$SERVER_NAME] Checking SSH to $SSH_USER@$SSH_ADDR:$SSH_PORT"
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_ADDR" \
            'echo "SSH OK: $(hostname) as $(id -un)"'
          echo ">>> [$SERVER_NAME] SSH connection OK"

      - name: Check deploy path exists
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
          SSH_USER: ${{ matrix.server.user }}
          DEPLOY_PATH: ${{ matrix.server.deploy_path }}
        run: |
          set -euo pipefail
          echo ">>> [$SERVER_NAME] Checking deploy path: $DEPLOY_PATH"
          REMOTE_PATH=$(printf '%q' "$DEPLOY_PATH")
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_ADDR" \
            "DEPLOY_PATH=$REMOTE_PATH bash -s" <<'REMOTE'
          set -euo pipefail
          HOST="$(hostname)"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "ERROR: deploy path does not exist on $HOST: $DEPLOY_PATH" >&2
            echo "Create it and grant ownership to $(id -un) before releasing." >&2
            exit 1
          fi
          if [ ! -w "$DEPLOY_PATH" ] || [ ! -x "$DEPLOY_PATH" ]; then
            echo "ERROR: deploy path is not writable by $(id -un) on $HOST: $DEPLOY_PATH" >&2
            exit 1
          fi
          echo "OK: $DEPLOY_PATH exists and is writable on $HOST"
          REMOTE
          echo ">>> [$SERVER_NAME] Deploy path OK"

  release:
    name: Build and publish release
    # Build in parallel with preflight. A broken server entry still blocks its
    # own deploy job (which needs preflight), but no longer the artifact.
    needs: validate-config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          # `musl-cache` in ci.yml warms this exact key on every push to main.
          # A tag run can restore caches written on the default branch, but it
          # can never read a cache written by another tag, so the warming has
          # to happen on main. `shared-key` is appended to the key and replaces
          # the automatic job-name component (rust-cache only adds GITHUB_JOB
          # when shared-key is empty), which is what lets the two jobs agree.
          # Keep it in sync with ci.yml or the restore silently misses and the
          # build falls back to a ~5 minute cold compile.
          shared-key: musl
          # Never save from a tag: a cache written by a tag is readable only by
          # that same tag, so it would be pure quota churn.
          save-if: false

      - name: Install cross
        # Prebuilt binary pinned by version + sha256 in the script (~1s instead
        # of ~30s compiling cross from source), and still no third-party action
        # in the release path.
        run: bash scripts/install-cross.sh

      - name: Build musl release binary
        run: |
          set -euo pipefail
          cross build --locked --release --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/smileyan-backend
          ls -lh "$BIN"
          file "$BIN"

          # A static musl binary must not depend on the host libc.
          # Recent Rust emits "static-pie linked"; accept both spellings.
          if ! file "$BIN" | grep -Eq 'statically linked|static-pie linked'; then
            echo "ERROR: binary is not statically linked" >&2
            file "$BIN" >&2
            exit 1
          fi
          # Do NOT gate on `ldd`: on Ubuntu 24.04 (glibc 2.39) it falls back
          # to the host ld.so for static-pie files, which prints "statically
          # linked" and exits 0 — a valid static musl binary would be flagged
          # as dynamic. DT_NEEDED entries are the authoritative signal; static
          # and static-pie binaries carry none.
          if ! command -v readelf >/dev/null; then
            echo "ERROR: readelf not found; install binutils to verify static linking" >&2
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "ERROR: binary is dynamically linked:" >&2
            readelf -d "$BIN" | grep NEEDED >&2
            exit 1
          fi

          # Size guard: catches accidental debug symbols / new heavy deps.
          SIZE=$(stat -c '%s' "$BIN")
          MAX=$((80 * 1024 * 1024))
          echo "size: $((SIZE / 1024 / 1024)) MiB (limit $((MAX / 1024 / 1024)) MiB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: release binary exceeds the 80 MiB size limit" >&2
            exit 1
          fi

      - name: Prepare release assets
        # release/ must contain EXACTLY three files; the sanity check below
        # guards against source/.env/extra files leaking into the tarball.
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          BIN=target/x86_64-unknown-linux-musl/release/smileyan-backend
          cp "$BIN" release/smileyan-backend
          chmod +x release/smileyan-backend

          cp scripts/deploy-remote.sh release/deploy-remote.sh
          chmod +x release/deploy-remote.sh

          # The committed template is mode: debug; the release is prod.
          sed 's/mode: debug/mode: prod/' config.yaml > release/config.yaml

          actual=$(ls -A1 release | sort)
          expected=$(printf '%s\n' deploy-remote.sh config.yaml smileyan-backend | sort)
          echo "release/ contents:"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: release/ contents mismatch." >&2
            diff <(echo "$expected") <(echo "$actual") >&2
            exit 1
          fi

          if find release -name '.env' -print -quit | grep -q .; then
            echo "ERROR: .env file leaked into the release bundle" >&2
            exit 1
          fi

          tar --no-xattr -czf smileyan-backend-prod.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: smileyan-backend-prod.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true

  deploy:
    name: Deploy to ${{ matrix.server.name }}
    # Stable tags only; pre-releases go to staging via staging.yml.
    needs: [validate-config, preflight, release]
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta')
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # SERVERS_CONFIG is a JSON array stored as a Repository Variable:
        # [
        #   {
        #     "name": "prod-1",
        #     "addr": "1.2.3.4",
        #     "port": "22",
        #     "user": "deploy",
        #     "deploy_path": "/opt/smileyan-backend",
        #     "app_port": "8080"
        #   }
        # ]
        # `app_port` is optional and defaults to 8080; set 8081 for a
        # co-hosted staging instance. `port` remains the SSH port.
        server: ${{ fromJSON(vars.SERVERS_CONFIG || '[]') }}

    steps:
      - name: Check required env vars
        # Hard precondition gate: fail fast with a clear list of missing
        # secrets before checkout/download/ssh setup.
        env:
          S_DB_HOST: ${{ secrets.SMILEYAN_BACKEND_DB_HOST }}
          S_DB_USER: ${{ secrets.SMILEYAN_BACKEND_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_DB_PASSWORD }}
          S_DB_NAME: ${{ secrets.SMILEYAN_BACKEND_DB_NAME }}
          S_REDIS_HOST: ${{ secrets.SMILEYAN_BACKEND_REDIS_HOST }}
          S_REDIS_USERNAME: ${{ secrets.SMILEYAN_BACKEND_REDIS_USERNAME }}
          S_REDIS_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_REDIS_PASSWORD }}
          S_EMAIL_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_EMAIL_PASSWORD }}
          S_JWT_SECRET: ${{ secrets.SMILEYAN_BACKEND_JWT_SECRET }}
          S_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -u
          PAIRS=(
            "SMILEYAN_BACKEND_DB_HOST|${S_DB_HOST}"
            "SMILEYAN_BACKEND_DB_USER|${S_DB_USER}"
            "SMILEYAN_BACKEND_DB_PASSWORD|${S_DB_PASSWORD}"
            "SMILEYAN_BACKEND_DB_NAME|${S_DB_NAME}"
            "SMILEYAN_BACKEND_REDIS_HOST|${S_REDIS_HOST}"
            "SMILEYAN_BACKEND_REDIS_USERNAME|${S_REDIS_USERNAME}"
            "SMILEYAN_BACKEND_REDIS_PASSWORD|${S_REDIS_PASSWORD}"
            "SMILEYAN_BACKEND_EMAIL_PASSWORD|${S_EMAIL_PASSWORD}"
            "SMILEYAN_BACKEND_JWT_SECRET|${S_JWT_SECRET}"
            "DEPLOY_SSH_KEY|${S_SSH_KEY}"
          )

          echo "=== Required env-var report ==="
          printf '%-40s %s\n' 'NAME' 'STATUS'
          printf '%-40s %s\n' '----' '------'
          MISSING=()
          for pair in "${PAIRS[@]}"; do
            name="${pair%%|*}"
            val="${pair#*|}"
            if [ -n "$val" ]; then
              printf '%-40s %s\n' "$name" 'OK (non-empty)'
            else
              printf '%-40s %s\n' "$name" 'EMPTY (not accessible to this workflow)'
              MISSING+=("$name")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo
            echo "FAIL: ${#MISSING[@]} required env var(s) are not accessible:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All required env vars are present."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download and extract release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "${{ github.ref_name }}" \
            --pattern "smileyan-backend-prod.tar.gz" \
            --dir dist
          tar -xzf dist/smileyan-backend-prod.tar.gz -C dist/release
          chmod +x dist/release/smileyan-backend dist/release/deploy-remote.sh
          test -f dist/release/config.yaml
          echo "release binary sha256: $(sha256sum dist/release/smileyan-backend | awk '{print $1}')"
          ls -lh dist/release

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ matrix.server.port }}" \
            -H "${{ matrix.server.addr }}" >> ~/.ssh/known_hosts

      - name: Transfer binary (zstd patch, rsync fallback)
        # See scripts/transfer-binary.sh for the full rationale and for the
        # measured numbers. Short version: the runner -> China link is the
        # release bottleneck (13.7-16.0 KB/s on v0.0.11), a rebuilt Rust binary
        # only matches ~17% of rsync's 32 KiB blocks (6.5 MiB on the wire), and
        # a zstd --patch-from dictionary built from the deployed binary brings
        # the same upgrade down to ~1 MiB. The script stages the binary in
        # /tmp/smileyan-deploy, leaving DEPLOY_PATH and the .prev rollback
        # target untouched until deploy-remote.sh runs.
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_DEPLOY_PATH: ${{ matrix.server.deploy_path }}
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
          SSH_USER: ${{ matrix.server.user }}
          RELEASE_TAG: ${{ github.ref_name }}
          LOCAL_BINARY: dist/release/smileyan-backend
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/transfer-binary.sh

      - name: Upload config and deploy script
        # Two tiny files (~14 KB total). Sent as one streamed tar so there is no
        # second handshake and no nested gzip of the already-gzipped binary.
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
          SSH_USER: ${{ matrix.server.user }}
        run: |
          set -euo pipefail
          echo ">>> [$SERVER_NAME] Uploading config.yaml and deploy-remote.sh"
          tar -czf - -C dist/release config.yaml deploy-remote.sh | \
            ssh -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$SSH_USER@$SSH_ADDR" \
              'mkdir -p /tmp/smileyan-deploy && tar -xzf - -C /tmp/smileyan-deploy && chmod +x /tmp/smileyan-deploy/deploy-remote.sh && ls -la /tmp/smileyan-deploy'

      - name: Verify transfer and assemble deployment tarball
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SSH_ADDR: ${{ matrix.server.addr }}
          SSH_PORT: ${{ matrix.server.port }}
          SSH_USER: ${{ matrix.server.user }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(sha256sum dist/release/smileyan-backend | awk '{print $1}')
          echo ">>> [$SERVER_NAME] Verifying uploaded binary"
          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_ADDR" \
            env EXPECTED_SHA="$EXPECTED_SHA" bash -s <<'REMOTE'
          set -euo pipefail
          cd /tmp/smileyan-deploy
          ACTUAL_SHA=$(sha256sum smileyan-backend | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: uploaded binary sha256 $ACTUAL_SHA != expected $EXPECTED_SHA" >&2
            exit 1
          fi
          test -f config.yaml
          test -x deploy-remote.sh
          tar -czf /tmp/smileyan-backend-deploy.tar.gz \
            smileyan-backend config.yaml deploy-remote.sh
          echo "OK: transfer verified (sha256 $ACTUAL_SHA); deployment tarball assembled"
          REMOTE

      - name: Run remote deploy script
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_DEPLOY_PATH: ${{ matrix.server.deploy_path }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
          RELEASE_TAG: ${{ github.ref_name }}
          S_DB_HOST: ${{ secrets.SMILEYAN_BACKEND_DB_HOST }}
          S_DB_USER: ${{ secrets.SMILEYAN_BACKEND_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_DB_PASSWORD }}
          S_DB_NAME: ${{ secrets.SMILEYAN_BACKEND_DB_NAME }}
          S_REDIS_HOST: ${{ secrets.SMILEYAN_BACKEND_REDIS_HOST }}
          S_REDIS_USER: ${{ secrets.SMILEYAN_BACKEND_REDIS_USERNAME }}
          S_REDIS_PASS: ${{ secrets.SMILEYAN_BACKEND_REDIS_PASSWORD }}
          S_EMAIL_PASS: ${{ secrets.SMILEYAN_BACKEND_EMAIL_PASSWORD }}
          S_JWT_SECRET: ${{ secrets.SMILEYAN_BACKEND_JWT_SECRET }}
          # Optional TTS configuration; empty values are not written to .env.
          S_TTS_BASE_URL: ${{ secrets.SMILEYAN_BACKEND_TTS_BASE_URL }}
          S_TTS_API_KEY: ${{ secrets.SMILEYAN_BACKEND_TTS_API_KEY }}
          S_TTS_MODEL: ${{ secrets.SMILEYAN_BACKEND_TTS_DEFAULT_MODEL }}
        run: |
          set -euo pipefail

          echo ">>> [$SERVER_NAME] Running deploy-remote.sh (streaming output)"
          # Single-quoted body: no re-expansion on the server. The tarball was
          # assembled and SHA256-verified on the server by the previous step.
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            "DEPLOY_PATH='$SERVER_DEPLOY_PATH' \
             RELEASE_TAG='$RELEASE_TAG' \
             APP_PORT='$APP_PORT' \
             TARBALL_PATH='/tmp/smileyan-backend-deploy.tar.gz' \
             S_DB_HOST='$S_DB_HOST' \
             S_DB_USER='$S_DB_USER' \
             S_DB_PASSWORD='$S_DB_PASSWORD' \
             S_DB_NAME='$S_DB_NAME' \
             S_REDIS_HOST='$S_REDIS_HOST' \
             S_REDIS_USER='$S_REDIS_USER' \
             S_REDIS_PASS='$S_REDIS_PASS' \
             S_EMAIL_PASS='$S_EMAIL_PASS' \
             S_JWT_SECRET='$S_JWT_SECRET' \
             S_TTS_BASE_URL='$S_TTS_BASE_URL' \
             S_TTS_API_KEY='$S_TTS_API_KEY' \
             S_TTS_MODEL='$S_TTS_MODEL' \
             bash -x /tmp/smileyan-deploy/deploy-remote.sh"

      - name: Inspect server-side state
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_DEPLOY_PATH: ${{ matrix.server.deploy_path }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
        run: |
          echo ">>> [$SERVER_NAME] Inspecting post-deploy state"
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            env DEPLOY_PATH="$SERVER_DEPLOY_PATH" APP_PORT="$APP_PORT" bash -s <<'REMOTE'
            set +e
            echo "=== deploy directory ==="
            ls -la "$DEPLOY_PATH/"
            echo
            echo "=== rollback artifacts ==="
            sha256sum "$DEPLOY_PATH/smileyan-backend" "$DEPLOY_PATH/smileyan-backend.prev" 2>&1 || true
            ls -la "$DEPLOY_PATH/rollback.sh" 2>&1 || true
            echo
            echo "=== last 30 lines of app.log ==="
            tail -n 30 "$DEPLOY_PATH/logs/app.log" 2>&1 || true
            echo
            echo "=== process list (smileyan-backend) ==="
            ps -ef | grep -E '[s]mileyan-backend' || echo "(no smileyan-backend process)"
            echo
            echo "=== listening socket on :$APP_PORT ==="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ":$APP_PORT" || echo "(nothing on :$APP_PORT)"
          REMOTE

      - name: Verify deployment
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
        run: |
          sleep 5
          echo ">>> [$SERVER_NAME] Health check on :$APP_PORT"
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            "curl -fsS http://127.0.0.1:$APP_PORT/api/categories >/dev/null && echo '[$SERVER_NAME] Health check OK'"
