name: Release

# Triggers on pushes of tags matching vX.Y.Z (e.g. v1.0.0, v2.3.1-rc1).
# - Builds the static x86_64-unknown-linux-musl binary with cross.
# - Publishes a GitHub Release containing a three-file prod tarball:
#   smileyan-backend, deploy-remote.sh and config.yaml (mode: prod).
# - Auto-generates a changelog from grouped PRs / commits since the previous tag.
# - For stable (non-prerelease) tags, deploys to every server in the
#   SERVERS_CONFIG repository variable over SSH, in parallel.
#
# No application secret is needed to build: the Rust binary resolves
# DB/Redis/email/TTS configuration at runtime. Secrets are only consumed by
# the deploy job, which writes them into the server-side .env.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release and upload the asset

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Print SERVERS_CONFIG (debug)
        # Surface the raw value as the runner sees it. Always runs (even when
        # unset), so a misconfigured variable is obvious in the log instead of
        # failing strategy evaluation with an opaque fromJSON error.
        env:
          RAW: ${{ vars.SERVERS_CONFIG }}
        run: |
          echo "=== vars.SERVERS_CONFIG (raw, repr) ==="
          printf '%s\n' "${RAW:-<unset>}" | python3 -c "import sys; data=sys.stdin.read(); print(repr(data))"
          echo
          echo "=== length / line count ==="
          if [ -z "${RAW:-}" ]; then
            echo "<empty / unset>"
          else
            printf 'bytes=%d  lines=%d\n' "${#RAW}" "$(printf '%s' "$RAW" | wc -l | tr -d ' ')"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        # Pinned-language toolchain is used from rust-toolchain.toml. Building
        # cross from source is slower than a prebuilt installer but has no
        # third-party action-version dependency in the release path.
        run: cargo install cross --locked

      - name: Build musl release binary
        run: |
          set -euo pipefail
          cross build --locked --release --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/smileyan-backend
          ls -lh "$BIN"
          file "$BIN"

          # A static musl binary must not depend on the host libc.
          # Recent Rust emits "static-pie linked"; accept both spellings.
          if ! file "$BIN" | grep -Eq 'statically linked|static-pie linked'; then
            echo "ERROR: binary is not statically linked" >&2
            file "$BIN" >&2
            exit 1
          fi
          # Do NOT gate on `ldd`: on Ubuntu 24.04 (glibc 2.39) it falls back
          # to the host ld.so for static-pie files, which prints "statically
          # linked" and exits 0 — a valid static musl binary would be flagged
          # as dynamic. DT_NEEDED entries are the authoritative signal; static
          # and static-pie binaries carry none.
          if ! command -v readelf >/dev/null; then
            echo "ERROR: readelf not found; install binutils to verify static linking" >&2
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "ERROR: binary is dynamically linked:" >&2
            readelf -d "$BIN" | grep NEEDED >&2
            exit 1
          fi

          # Size guard: catches accidental debug symbols / new heavy deps.
          SIZE=$(stat -c '%s' "$BIN")
          MAX=$((80 * 1024 * 1024))
          echo "size: $((SIZE / 1024 / 1024)) MiB (limit $((MAX / 1024 / 1024)) MiB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: release binary exceeds the 80 MiB size limit" >&2
            exit 1
          fi

      - name: Prepare release assets
        # release/ must contain EXACTLY three files; the sanity check below
        # guards against source/.env/extra files leaking into the tarball.
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          BIN=target/x86_64-unknown-linux-musl/release/smileyan-backend
          cp "$BIN" release/smileyan-backend
          chmod +x release/smileyan-backend

          cp scripts/deploy-remote.sh release/deploy-remote.sh
          chmod +x release/deploy-remote.sh

          # The committed template is mode: debug; the release is prod.
          sed 's/mode: debug/mode: prod/' config.yaml > release/config.yaml

          actual=$(ls -A1 release | sort)
          expected=$(printf '%s\n' deploy-remote.sh config.yaml smileyan-backend | sort)
          echo "release/ contents:"
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: release/ contents mismatch." >&2
            diff <(echo "$expected") <(echo "$actual") >&2
            exit 1
          fi

          if find release -name '.env' -print -quit | grep -q .; then
            echo "ERROR: .env file leaked into the release bundle" >&2
            exit 1
          fi

          tar --no-xattr -czf smileyan-backend-prod.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: smileyan-backend-prod.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true

  deploy:
    name: Deploy to ${{ matrix.server.name }}
    # Stable tags only; pre-releases go to staging via staging.yml.
    needs: release
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta')
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # SERVERS_CONFIG is a JSON array stored as a Repository Variable:
        # [
        #   {
        #     "name": "prod-1",
        #     "addr": "1.2.3.4",
        #     "port": "22",
        #     "user": "deploy",
        #     "deploy_path": "/opt/smileyan-backend",
        #     "app_port": "8080"
        #   }
        # ]
        # `app_port` is optional and defaults to 8080; set 8081 for a
        # co-hosted staging instance. `port` remains the SSH port.
        server: ${{ fromJSON(vars.SERVERS_CONFIG || '[]') }}

    steps:
      - name: Check required env vars
        # Hard precondition gate: fail fast with a clear list of missing
        # secrets before checkout/download/ssh setup.
        env:
          S_DB_HOST: ${{ secrets.SMILEYAN_BACKEND_DB_HOST }}
          S_DB_USER: ${{ secrets.SMILEYAN_BACKEND_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_DB_PASSWORD }}
          S_DB_NAME: ${{ secrets.SMILEYAN_BACKEND_DB_NAME }}
          S_REDIS_HOST: ${{ secrets.SMILEYAN_BACKEND_REDIS_HOST }}
          S_REDIS_USERNAME: ${{ secrets.SMILEYAN_BACKEND_REDIS_USERNAME }}
          S_REDIS_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_REDIS_PASSWORD }}
          S_EMAIL_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_EMAIL_PASSWORD }}
          S_JWT_SECRET: ${{ secrets.SMILEYAN_BACKEND_JWT_SECRET }}
          S_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -u
          PAIRS=(
            "SMILEYAN_BACKEND_DB_HOST|${S_DB_HOST}"
            "SMILEYAN_BACKEND_DB_USER|${S_DB_USER}"
            "SMILEYAN_BACKEND_DB_PASSWORD|${S_DB_PASSWORD}"
            "SMILEYAN_BACKEND_DB_NAME|${S_DB_NAME}"
            "SMILEYAN_BACKEND_REDIS_HOST|${S_REDIS_HOST}"
            "SMILEYAN_BACKEND_REDIS_USERNAME|${S_REDIS_USERNAME}"
            "SMILEYAN_BACKEND_REDIS_PASSWORD|${S_REDIS_PASSWORD}"
            "SMILEYAN_BACKEND_EMAIL_PASSWORD|${S_EMAIL_PASSWORD}"
            "SMILEYAN_BACKEND_JWT_SECRET|${S_JWT_SECRET}"
            "DEPLOY_SSH_KEY|${S_SSH_KEY}"
          )

          echo "=== Required env-var report ==="
          printf '%-40s %s\n' 'NAME' 'STATUS'
          printf '%-40s %s\n' '----' '------'
          MISSING=()
          for pair in "${PAIRS[@]}"; do
            name="${pair%%|*}"
            val="${pair#*|}"
            if [ -n "$val" ]; then
              printf '%-40s %s\n' "$name" 'OK (non-empty)'
            else
              printf '%-40s %s\n' "$name" 'EMPTY (not accessible to this workflow)'
              MISSING+=("$name")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo
            echo "FAIL: ${#MISSING[@]} required env var(s) are not accessible:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All required env vars are present."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --pattern "smileyan-backend-prod.tar.gz" \
            --dir dist
          ls -la dist

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ matrix.server.port }}" \
            -H "${{ matrix.server.addr }}" >> ~/.ssh/known_hosts

      - name: Upload tarball to server
        run: |
          set -e
          echo ">>> [${{ matrix.server.name }}] Uploading tarball"
          scp -P "${{ matrix.server.port }}" dist/smileyan-backend-prod.tar.gz \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}:/tmp/smileyan-backend-prod.tar.gz"

      - name: Run remote deploy script
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_DEPLOY_PATH: ${{ matrix.server.deploy_path }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
          RELEASE_TAG: ${{ github.ref_name }}
          S_DB_HOST: ${{ secrets.SMILEYAN_BACKEND_DB_HOST }}
          S_DB_USER: ${{ secrets.SMILEYAN_BACKEND_DB_USER }}
          S_DB_PASSWORD: ${{ secrets.SMILEYAN_BACKEND_DB_PASSWORD }}
          S_DB_NAME: ${{ secrets.SMILEYAN_BACKEND_DB_NAME }}
          S_REDIS_HOST: ${{ secrets.SMILEYAN_BACKEND_REDIS_HOST }}
          S_REDIS_USER: ${{ secrets.SMILEYAN_BACKEND_REDIS_USERNAME }}
          S_REDIS_PASS: ${{ secrets.SMILEYAN_BACKEND_REDIS_PASSWORD }}
          S_EMAIL_PASS: ${{ secrets.SMILEYAN_BACKEND_EMAIL_PASSWORD }}
          S_JWT_SECRET: ${{ secrets.SMILEYAN_BACKEND_JWT_SECRET }}
          # Optional TTS configuration; empty values are not written to .env.
          S_TTS_BASE_URL: ${{ secrets.SMILEYAN_BACKEND_TTS_BASE_URL }}
          S_TTS_API_KEY: ${{ secrets.SMILEYAN_BACKEND_TTS_API_KEY }}
          S_TTS_MODEL: ${{ secrets.SMILEYAN_BACKEND_TTS_DEFAULT_MODEL }}
        run: |
          set -euo pipefail

          echo ">>> [$SERVER_NAME] Extracting deploy-remote.sh from the tarball"
          mkdir -p /tmp/deploy-tools
          tar -xzf dist/smileyan-backend-prod.tar.gz -C /tmp/deploy-tools ./deploy-remote.sh
          chmod +x /tmp/deploy-tools/deploy-remote.sh

          echo ">>> [$SERVER_NAME] Uploading deploy script"
          scp -P "${{ matrix.server.port }}" \
            /tmp/deploy-tools/deploy-remote.sh \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}:/tmp/deploy-remote.sh"

          echo ">>> [$SERVER_NAME] Running deploy-remote.sh (streaming output)"
          # Single-quoted body: no re-expansion on the server.
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            "DEPLOY_PATH='$SERVER_DEPLOY_PATH' \
             RELEASE_TAG='$RELEASE_TAG' \
             APP_PORT='$APP_PORT' \
             TARBALL_PATH='/tmp/smileyan-backend-prod.tar.gz' \
             S_DB_HOST='$S_DB_HOST' \
             S_DB_USER='$S_DB_USER' \
             S_DB_PASSWORD='$S_DB_PASSWORD' \
             S_DB_NAME='$S_DB_NAME' \
             S_REDIS_HOST='$S_REDIS_HOST' \
             S_REDIS_USER='$S_REDIS_USER' \
             S_REDIS_PASS='$S_REDIS_PASS' \
             S_EMAIL_PASS='$S_EMAIL_PASS' \
             S_JWT_SECRET='$S_JWT_SECRET' \
             S_TTS_BASE_URL='$S_TTS_BASE_URL' \
             S_TTS_API_KEY='$S_TTS_API_KEY' \
             S_TTS_MODEL='$S_TTS_MODEL' \
             bash -x /tmp/deploy-remote.sh"

      - name: Inspect server-side state
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          SERVER_DEPLOY_PATH: ${{ matrix.server.deploy_path }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
        run: |
          echo ">>> [$SERVER_NAME] Inspecting post-deploy state"
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            env DEPLOY_PATH="$SERVER_DEPLOY_PATH" APP_PORT="$APP_PORT" bash -s <<'REMOTE'
            set +e
            echo "=== deploy directory ==="
            ls -la "$DEPLOY_PATH/"
            echo
            echo "=== rollback artifacts ==="
            sha256sum "$DEPLOY_PATH/smileyan-backend" "$DEPLOY_PATH/smileyan-backend.prev" 2>&1 || true
            ls -la "$DEPLOY_PATH/rollback.sh" 2>&1 || true
            echo
            echo "=== last 30 lines of app.log ==="
            tail -n 30 "$DEPLOY_PATH/logs/app.log" 2>&1 || true
            echo
            echo "=== process list (smileyan-backend) ==="
            ps -ef | grep -E '[s]mileyan-backend' || echo "(no smileyan-backend process)"
            echo
            echo "=== listening socket on :$APP_PORT ==="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ":$APP_PORT" || echo "(nothing on :$APP_PORT)"
          REMOTE

      - name: Verify deployment
        env:
          SERVER_NAME: ${{ matrix.server.name }}
          APP_PORT: ${{ matrix.server.app_port || '8080' }}
        run: |
          sleep 5
          echo ">>> [$SERVER_NAME] Health check on :$APP_PORT"
          ssh -p "${{ matrix.server.port }}" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ matrix.server.user }}@${{ matrix.server.addr }}" \
            "curl -fsS http://127.0.0.1:$APP_PORT/api/categories >/dev/null && echo '[$SERVER_NAME] Health check OK'"
